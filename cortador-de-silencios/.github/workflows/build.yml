name: Pruebas y .exe para Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # para adjuntar el .zip a la Release cuando se publica un tag v*

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Pruebas
        run: python -m unittest discover -s pruebas -v

      - name: Generar el .exe
        run: pyinstaller --noconfirm cortador.spec

      - name: Empaquetar
        shell: pwsh
        run: |
          $version = python -c "import cortar; print(cortar.__version__)"
          Compress-Archive -Path dist/CortadorDeSilencios -DestinationPath "CortadorDeSilencios-v$version-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: CortadorDeSilencios-windows
          path: CortadorDeSilencios-v*-windows.zip

      - name: Publicar en la Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CortadorDeSilencios-v*-windows.zip
